[package]
name = "codex-app-server-bridge"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
description = "Expose the local Codex app-server control socket over loopback WebSocket"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chang196700/codex-app-server-bridge"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fs2 = "0.4.3"
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"

[target.'cfg(unix)'.dependencies]
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5.0"
socket2 = { version = "0.6.5", features = ["all"] }
windows-service = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
strip = true

