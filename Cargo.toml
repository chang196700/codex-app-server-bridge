[package]
name = "codex-app-server-bridge"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Expose the local Codex app-server control socket over loopback WebSocket"
license = "MIT"
repository = "https://github.com/chang196700/codex-app-server-bridge"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
windows-service = "0.8"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true

